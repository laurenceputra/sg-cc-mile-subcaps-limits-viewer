<!doctype html>
<meta charset="utf-8">
<h2>LADY'S SOLITAIRE CARD</h2>
<p>SECRET-MERCHANT-DESCRIPTION</p>
<script>
const scenario = new URLSearchParams(location.search).get('scenario');
const reports = [];
console.info = (text) => reports.push(text);
const values = new Map();
if (scenario === 'held') values.set('ccSubcapSyncConfig', JSON.stringify({
  enabled: true, rememberUnlock: true, serverUrl: 'https://example.invalid', email: 'SECRET-EMAIL', deviceId: 'SECRET-DEVICE'
}));
let vaultOpens = 0;
if (scenario === 'held') {
  values.set('ccSubcapSyncUnlockCache:' + location.hostname, JSON.stringify({
    expiresAt: Date.now() + 600000, email: 'SECRET-EMAIL',
    encrypted: { ciphertext: 'SECRET-CIPHERTEXT', iv: 'SECRET-IV' }
  }));
  // Simulate an indefinitely pending secure-vault open, not a missing cache.
  if (!crypto.subtle) Object.defineProperty(crypto, 'subtle', { value: {} });
  indexedDB.open = () => { vaultOpens += 1; return {}; };
  globalThis.fetch = () => new Promise(() => {});
}
if (scenario === 'failure' || scenario === 'failure-retry') values.set('ccSubcapSyncConfig', 'null');
globalThis.GM_getValue = (key, fallback) => values.get(key) ?? fallback;
globalThis.GM_setValue = (key, value) => values.set(key, value);
globalThis.GM_addStyle = (css) => {
  if (scenario === 'style-failure' || scenario === 'repeated-failure') throw new TypeError('SECRET-MALICIOUS-MESSAGE');
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
};
// Hold optional sync transport indefinitely; startup must not wait for it.
globalThis.GM_xmlhttpRequest = () => {};
</script>
<script src="/userscript.js"></script>
<script>
(async () => {
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const readReport = () => JSON.parse(document.getElementById('cc-subcap-startup-report').textContent.replace('[Subcap startup] ', ''));
  try {
    await wait(scenario === 'deadline' ? 20100 : 100);
    let report = readReport();
    check(report.build === '1.1.3' && report.attempt === 1, 'build and attempt');
    check(report.route === (scenario === 'deadline' ? '/m2u/accounts/cards' : scenario === 'deadline-entry' ? 'other' : '/accountDetail'), 'whitelisted route');
    if (scenario === 'deadline-entry') {
      check(report.reason === 'unsupported-route', 'initial terminal outcome');
      history.pushState({}, '', '/m2u/accounts/cards?SECRET-ENTRY');
      await wait(22000);
      report = readReport();
      check(report.reason === 'deadline' && report.stage === 'card-check' && report.routeMatch === 1 && report.route === '/m2u/accounts/cards', 'rearmed lifecycle deadline');
    } else if (scenario === 'deadline') {
      check(report.reason === 'deadline' && report.stage === 'card-check' && report.runtime === 1 && report.deadlineMs === 20000, 'bounded deadline');
    } else if (['failure', 'failure-retry', 'style-failure', 'repeated-failure'].includes(scenario)) {
      check(report.reason === 'initialization-failure' && report.error === 'TypeError', 'sanitized exception');
      check(report.stage === (scenario.startsWith('failure') ? 'sync-manager' : 'button-create'), 'failure stage');
      if (scenario === 'failure-retry') {
        values.delete('ccSubcapSyncConfig');
        const script = document.createElement('script'); script.src = '/userscript.js';
        document.head.appendChild(script);
        await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });
        await wait(100);
        report = readReport();
        check(report.reason === 'ready' && report.attempt === 2 && report.error === 'none', 'synchronous failure retry');
      }
      if (scenario === 'repeated-failure') {
        globalThis.GM_addStyle = () => { throw new RangeError('SECRET-SECOND-ERROR'); };
        history.pushState({}, '', '/accountDetail?SECRET-SECOND');
        await wait(1200);
        report = readReport();
        check(report.reason === 'initialization-failure' && report.error === 'RangeError', 'repeated failure error freshness');
        values.set('ccSubcapSettings', 'null');
        history.pushState({}, '', '/accountDetail?SECRET-THIRD');
        await wait(1200);
        report = readReport();
        check(report.reason === 'initialization-failure' && report.stage === 'settings' && report.error === 'TypeError', 'repeated failure stage freshness');
        values.delete('ccSubcapSettings');
        globalThis.GM_addStyle = (css) => { const style = document.createElement('style'); style.textContent = css; document.head.appendChild(style); };
        history.pushState({}, '', '/accountDetail?SECRET-RECOVERY');
        await wait(1200);
        report = readReport();
        check(report.reason === 'ready' && report.error === 'none', 'runtime recovery clears stale failure');
      }
    } else {
      check(report.reason === 'ready' && report.created === 1, 'automatic startup');
      check(report.runtime === 1 && report.routeMatch === 1 && report.cardMatch === 1 && report.headings === 1, 'numeric flags');
      check(report.visibleHeadings === 1 && document.querySelector('h2').children.length === 0, 'plain visible heading');
      if (scenario === 'held') check(vaultOpens === 1, 'remembered unlock is actually held');
      const button = [...document.querySelectorAll('button')].find((node) => node.textContent === 'Subcap Tools');
      check(button && !button.disabled && button.getAttribute('aria-disabled') === 'false', 'accessible enabled button');
      check(getComputedStyle(button).position === 'fixed', 'standalone styles');
      if (scenario === 'disabled' || scenario === 'held') {
        button.click();
        await wait(2000);
        const overlay = document.getElementById('cc-subcap-overlay');
        check(overlay && getComputedStyle(overlay).display !== 'none', 'local tools open while sync is disabled or held');
      }
      if (scenario === 'ready-query') {
        const consoleCount = reports.length;
        history.pushState({}, '', '/accountDetail?SECRET-QUERY-CHANGED');
        await wait(1200);
        report = readReport();
        check(report.reason === 'ready' && report.created === 2 && report.stage === 'button-created', 'same reason refreshed marker');
        check(reports.length === consoleCount, 'console reason dedup');
        let markerWrites = 0;
        const observer = new MutationObserver(() => { markerWrites += 1; });
        observer.observe(document.getElementById('cc-subcap-startup-report'), { childList: true, subtree: true, characterData: true });
        await wait(2000);
        observer.disconnect();
        check(markerWrites === 0 && readReport().created === 2, 'no diagnostic observer loop');
      } else if (scenario === 'duplicate') {
        const script = document.createElement('script');
        script.src = '/userscript.js';
        document.head.appendChild(script);
        await new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });
        report = readReport();
        check(report.reason === 'duplicate-blocked' && report.guard === 1 && report.attempt === 2, 'duplicate attempt');
        history.pushState({}, '', '/accountDetail?SECRET-AFTER-GUARD');
        await wait(1200);
        check(readReport().attempt === 2 && document.querySelector('button'), 'live guarded runtime remains usable');
      } else if (scenario === 'wrong-card') {
        document.querySelector('h2').textContent = 'UNSUPPORTED CARD';
        await wait(1200);
        report = readReport();
        check(['observer-card-not-found', 'card-not-found'].includes(report.reason) && report.removed >= 1, 'card removal reason');
        check(!document.querySelector('button'), 'unsupported card removed');
      } else {
        history.pushState({}, '', '/unsupported?SECRET-QUERY');
        await wait(1200);
        report = readReport();
        check(report.reason === 'unsupported-route' && report.removed >= 1 && report.route === 'other', 'removal reason: ' + JSON.stringify(report));
        check(!document.querySelector('button'), 'button removed');
      }
    }
    check(reports.length <= 3 && reports.length > 0, 'bounded console');
    check(!reports.join('').includes('SECRET'), 'no private fields');
    check(!document.getElementById('cc-subcap-startup-report').textContent.includes('SECRET'), 'no marker secrets');
    const result = document.createElement('pre'); result.id = 'result'; result.textContent = 'PASS: production startup'; document.body.appendChild(result);
  } catch (error) {
    const result = document.createElement('pre'); result.id = 'result'; result.textContent = 'FAIL: ' + error.message; document.body.appendChild(result);
  }
})();
</script>
