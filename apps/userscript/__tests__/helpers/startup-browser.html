<!doctype html>
<meta charset="utf-8">
<h2>LADY'S SOLITAIRE CARD</h2>
<script>
const scenario = new URLSearchParams(location.search).get('scenario');
const values = new Map();
let vaultOpens = 0;
if (scenario === 'held') {
  values.set('ccSubcapSyncConfig', JSON.stringify({
    enabled: true, rememberUnlock: true, serverUrl: 'https://example.invalid', email: 'fixture@example.invalid', deviceId: 'fixture-device'
  }));
  values.set('ccSubcapSyncUnlockCache:' + location.hostname, JSON.stringify({
    expiresAt: Date.now() + 600000, email: 'fixture@example.invalid',
    encrypted: { ciphertext: 'fixture-ciphertext', iv: 'fixture-iv' }
  }));
  // Simulate an indefinitely pending secure-vault open, not a missing cache.
  if (!crypto.subtle) Object.defineProperty(crypto, 'subtle', { value: {} });
  indexedDB.open = () => { vaultOpens += 1; return {}; };
  globalThis.fetch = () => new Promise(() => {});
}
if (scenario === 'failure-retry') values.set('ccSubcapSyncConfig', 'null');
globalThis.GM_getValue = (key, fallback) => values.get(key) ?? fallback;
globalThis.GM_setValue = (key, value) => values.set(key, value);
const addStyle = (css) => {
  const style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);
};
globalThis.GM_addStyle = scenario === 'style-recovery'
  ? () => { throw new TypeError('Fixture style failure'); } : addStyle;
// Hold optional sync transport indefinitely; startup must not wait for it.
globalThis.GM_xmlhttpRequest = () => {};
</script>
<script src="/userscript.js"></script>
<script>
(async () => {
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const buttons = () => [...document.querySelectorAll('button')].filter((node) => node.textContent === 'Subcap Tools');
  const inject = async () => {
    const script = document.createElement('script');
    script.src = '/userscript.js';
    const loaded = new Promise((resolve, reject) => { script.onload = resolve; script.onerror = reject; });
    document.head.appendChild(script);
    await loaded;
    await wait(100);
  };
  try {
    await wait(100);
    if (scenario === 'failure-retry') {
      check(buttons().length === 0 && !window.__ccSubcapInjected, 'failed synchronous setup releases guard');
      values.delete('ccSubcapSyncConfig');
      await inject();
    } else if (scenario === 'style-recovery') {
      check(buttons().length === 0, 'failed style setup does not create button');
      globalThis.GM_addStyle = addStyle;
      history.pushState({}, '', '/accountDetail?recovery');
      await wait(1200);
    }
    check(document.querySelector('h2').children.length === 0, 'plain exact card heading');
    check(!document.querySelector('table'), 'startup without a transaction table');
    if (scenario === 'held') check(vaultOpens === 1, 'remembered unlock is actually held');
    check(buttons().length === 1, 'single automatic startup button');
    const button = buttons()[0];
    check(!button.disabled && button.getAttribute('aria-disabled') === 'false', 'accessible enabled button');
    check(getComputedStyle(button).position === 'fixed', 'standalone styles');
    if (scenario === 'disabled' || scenario === 'held') {
      button.click();
      await wait(2000);
      const overlay = document.getElementById('cc-subcap-overlay');
      check(overlay && getComputedStyle(overlay).display !== 'none', 'local tools open while sync is disabled or held');
    }
    if (scenario === 'duplicate') {
      await inject();
      check(buttons().length === 1 && buttons()[0] === button, 'duplicate injection leaves existing button intact');
      history.pushState({}, '', '/accountDetail?after-guard');
      await wait(1200);
      check(buttons().length === 1 && !buttons()[0].disabled, 'guarded runtime remains usable');
    } else if (scenario === 'wrong-card') {
      document.querySelector('h2').textContent = 'UNSUPPORTED CARD';
      await wait(1200);
      check(buttons().length === 0, 'unsupported card removes tools');
      document.querySelector('h2').textContent = "LADY'S SOLITAIRE CARD";
      await wait(1200);
      check(buttons().length === 1, 'same-route supported card recovery');
    } else if (scenario === 'route-refresh') {
      history.pushState({}, '', '/accountDetail?changed');
      await wait(1200);
      check(buttons().length === 1 && !buttons()[0].disabled, 'query navigation retains a single usable button');
    } else {
      history.pushState({}, '', '/unsupported');
      await wait(1200);
      check(buttons().length === 0, 'unsupported route removes tools');
    }
    const result = document.createElement('pre'); result.id = 'result'; result.textContent = 'PASS: production startup'; document.body.appendChild(result);
  } catch (error) {
    const result = document.createElement('pre'); result.id = 'result'; result.textContent = 'FAIL: ' + error.message; document.body.appendChild(result);
  }
})();
</script>
